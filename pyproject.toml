[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matro"
version = "0.1.0rc2"
description = "Metric-aware derivative-free trust-region optimization"
readme = "SOLVER.md"
requires-python = ">=3.10"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "src/matro/_newuoa/LICENSE.txt"]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"matro._newuoa" = ["LICENSE.txt", "*.json", "README.md", "reference_source/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/huwei-research/matro_software"
Issues = "https://github.com/huwei-research/matro_software/issues"
